CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000
CONFIG_ZMK_PM_SOFT_OFF=y

CONFIG_ZMK_POINTING=y
CONFIG_I2C=y
CONFIG_INPUT_THREAD_STACK_SIZE=1024

CONFIG_ZMK_KEYBOARD_NAME="Gordelia Cirque"

# --- Debug logging (disable when not debugging to save battery) ---
CONFIG_ZMK_USB_LOGGING=y
CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=5000
# I2C bus: verifica si el Cirque responde en 0x2a al arrancar
CONFIG_I2C_LOG_LEVEL_DBG=y
# Driver input genérico — cubre el driver Cirque Pinnacle y eventos de movimiento
CONFIG_INPUT_LOG_LEVEL_DBG=y